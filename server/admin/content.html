<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>世界书内容管理</title
  ><style>
    body {
      font-family: system-ui;
      color: #eee;
      background: #171717;
      margin: 0;
    }
    .bar {
      background: #d9a441;
      color: #171717;
      padding: 14px 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .wrap {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 14px;
    }
    .panel {
      background: #242424;
      border: 1px solid #444;
      border-radius: 7px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .list {
      max-height: 70vh;
      overflow: auto;
    }
    .item {
      display: block;
      width: 100%;
      text-align: left;
      background: #171717;
      color: #eee;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 9px;
      margin: 5px 0;
      cursor: pointer;
    }
    .item.active {
      border-color: #d9a441;
    }
    .muted {
      color: #aaa;
      font-size: 13px;
    }
    label {
      display: block;
      margin: 8px 0;
    }
    input,
    textarea,
    select,
    button {
      font: inherit;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #555;
    }
    input,
    textarea,
    select {
      width: 100%;
      background: #111;
      color: #fff;
    }
    textarea {
      min-height: 280px;
      resize: vertical;
    }
    button {
      background: #d9a441;
      color: #171717;
      border: 0;
      cursor: pointer;
    }
    .danger {
      background: #c85555;
      color: #fff;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .list {
        max-height: 35vh;
      }
    }
  </style>
  <body>
    <header class="bar">
      <b>阿卡狄亚工坊 · 内容管理</b
      ><a href="/admin" style="color: #171717">条目审核</a
      ><a href="/admin/users" style="color: #171717">用户管理</a>
    </header>
    <main class="wrap">
      <div class="panel row">
        <select id="module">
          <option value="worldbook">世界书本体</option>
          <option value="workshop">创意工坊</option></select
        ><input id="worldbook" placeholder="世界书名称（可选）" /><button
          id="reload"
        >
          刷新</button
        ><span id="msg" class="muted"></span>
      </div>
      <div class="grid">
        <section class="panel"><div id="list" class="list"></div></section>
        <section class="panel">
          <div id="empty" class="muted">选择左侧条目编辑</div>
          <form id="form" hidden>
            <input type="hidden" id="id" /><label
              >条目名称<input id="name" required /></label
            ><label
              >分类<select id="category">
                <option>商品</option>
                <option>综合商品</option>
                <option>生物</option>
                <option>药品</option>
                <option>改造</option>
                <option>特殊改造</option>
                <option>装备</option>
                <option>武器</option>
              </select></label
            ><label>世界书名称<input id="wb" /></label
            ><label>UID<input id="uid" required /></label
            ><label
              >触发策略<select id="strategy">
                <option value="selective">绿灯（关键词触发）</option>
                <option value="constant">蓝灯（始终启用）</option>
              </select></label
            ><label
              >触发关键词<input id="keys" placeholder="用逗号分隔" /></label
            ><label>顺序<input id="order" type="number" step="1" /></label
            ><label
              >插入位置<input
                id="position"
                placeholder="after_character_definition" /></label
            ><label>条目内容<textarea id="content"></textarea></label>
            <div class="row"><label>下载量<input id="downloads" type="number" min="0" step="1" /></label><label>点赞量<input id="likes" type="number" min="0" step="1" /></label><label>举报量<input id="reports" type="number" min="0" step="1" /></label></div>
            <div id="reactionUsers" class="muted"></div>
            <div class="row">
              <button type="submit">保存</button
              ><button type="button" class="danger" id="remove">删除</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let items = [],
        selected = null;
      async function api(u, o = {}) {
        const r = await fetch(u, {
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              ...(localStorage.getItem("arcadia_admin_token")
                ? {
                    Authorization:
                      "Bearer " + localStorage.getItem("arcadia_admin_token"),
                  }
                : {}),
            },
            ...o,
          }),
          d = await r.json().catch(() => ({}));
        if (!r.ok) throw Error([d.error, d.detail, d.requestId && `请求编号：${d.requestId}`].filter(Boolean).join("\n"));
        return d;
      }
      async function load() {
        try {
          const d = await api(
            "/api/admin/worldbook?module=" +
              $("module").value +
              "&worldbook=" +
              encodeURIComponent($("worldbook").value),
          );
          items = d.items;
          render();
          $("msg").textContent = "共 " + items.length + " 条";
        } catch (e) {
          $("msg").textContent = e.message;
        }
      }
      function render() {
        $("list").innerHTML = items.length
          ? items
              .map(
                (i) =>
                  `<button class="item ${selected?.id === i.id ? "active" : ""}" onclick="pick('${i.id}')">${esc(i.name)}<br><small>${esc(i.category || "商品")} · ${i.enabled ? "启用" : "停用"} · ${i.strategy?.type === "constant" ? "蓝灯" : "绿灯"} · 顺序 ${i.position?.order ?? 0} · 下载 ${i.downloadCount ?? 0} · 赞 ${i.likeCount ?? 0} · 举报 ${i.reportCount ?? 0}</small></button>`,
              )
              .join("")
          : '<p class="muted">暂无条目</p>';
      }
      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function pick(id) {
        selected = items.find((i) => i.id === id);
        if (!selected) return;
        $("empty").hidden = true;
        $("form").hidden = false;
        $("id").value = selected.id;
        $("name").value = selected.name;
        $("category").value = selected.category || "商品";
        $("wb").value = selected.worldbookName;
        $("uid").value = selected.uid;
        $("strategy").value =
          selected.strategy?.type === "constant" ? "constant" : "selective";
        $("keys").value = (selected.strategy?.keys || []).join(",");
        $("order").value = selected.position?.order ?? 0;
        $("position").value = selected.position?.type || "";
        $("content").value = selected.content || "";
        $("downloads").value = selected.downloadCount ?? 0;
        $("likes").value = selected.likeCount ?? 0;
        $("reports").value = selected.reportCount ?? 0;
        $("reactionUsers").textContent = "正在读取互动账号…";
        api("/api/admin/worldbook/" + encodeURIComponent(selected.id) + "/reactions")
          .then((data) => {
            const likes = (data.reactions || []).filter((r) => r.reaction === "like").map((r) => r.username);
            const reports = (data.reactions || []).filter((r) => r.reaction === "report").map((r) => r.username);
            $("reactionUsers").textContent = "点赞者：" + (likes.join("、") || "无") + "；踩/举报者：" + (reports.join("、") || "无");
          })
          .catch((error) => { $("reactionUsers").textContent = "互动账号读取失败：" + error.message; });
        render();
      }
      $("form").onsubmit = async (e) => {
        e.preventDefault();
        try {
          const result = await api("/api/admin/worldbook", {
            method: "POST",
            body: JSON.stringify({
              id: $("id").value,
              module: $("module").value,
              worldbookName: $("wb").value,
              uid: $("uid").value,
              name: $("name").value,
              category: $("category").value,
              content: $("content").value,
              strategy: {
                type: $("strategy").value,
                keys: $("keys")
                  .value.split(/[,，]/)
                  .map((x) => x.trim())
                  .filter(Boolean),
              },
              position: {
                type: $("position").value,
                order: Number($("order").value) || 0,
              },
              enabled: true,
              downloadCount: Number($("downloads").value) || 0,
              likeCount: Number($("likes").value) || 0,
              reportCount: Number($("reports").value) || 0,
            }),
          });
          if (!result.item?.id) throw Error("服务端未返回保存结果");
          selected = result.item;
          $("msg").textContent = "已保存：" + result.item.name;
          await load();
        } catch (e) {
          $("msg").textContent = e.message;
        }
      };
      $("remove").onclick = async () => {
        if (selected && confirm("确定删除？")) {
          const removing = selected;
          try {
            $("remove").disabled = true;
            const result = await api(
              "/api/admin/worldbook/" + encodeURIComponent(removing.id),
              { method: "DELETE" },
            );
            if (!result.ok) throw Error("服务端没有删除该条目");
            selected = null;
            $("form").hidden = true;
            $("empty").hidden = false;
            $("msg").textContent = "已删除：" + removing.name;
            await load();
          } catch (e) {
            $("msg").textContent = "删除失败：" + e.message;
          } finally {
            $("remove").disabled = false;
          }
        }
      };
      $("reload").onclick = load;
      $("module").onchange = load;
      load();
    </script>
  </body>
</html>
