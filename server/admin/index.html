<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>阿卡狄亚工坊管理</title>
    <style>
      body {
        font-family: system-ui;
        color: #eee;
        background: #171717;
        margin: 0;
      }
      .bar {
        background: #d9a441;
        color: #171717;
        padding: 16px 22px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .nav {
        display: none;
        gap: 12px;
      }
      .nav.visible {
        display: flex;
      }
      .nav a {
        color: #171717;
        font-weight: 700;
      }
      .wrap {
        max-width: 1050px;
        margin: 30px auto;
        padding: 0 16px;
      }
      .panel {
        background: #242424;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 20px;
      }
      .login {
        max-width: 500px;
        margin: 15vh auto;
      }
      .login-row {
        display: flex;
        gap: 8px;
      }
      .login-row input {
        flex: 1;
      }
      input,
      button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 5px;
        border: 1px solid #555;
      }
      input {
        background: #111;
        color: #fff;
      }
      button {
        background: #d9a441;
        color: #171717;
        border: 0;
        cursor: pointer;
        font-weight: 600;
      }
      .ghost {
        background: #444;
        color: #fff;
      }
      .muted {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <b>阿卡狄亚物品工坊 · 管理</b>
      <nav id="nav" class="nav">
        <a href="/admin/content">内容管理</a><a href="/admin/users">用户管理</a>
      </nav>
      <button id="logout" class="ghost" hidden>退出</button>
    </header>
    <main class="wrap">
      <section id="login" class="panel login">
        <h2>管理员登录</h2>
        <div class="login-row">
          <input id="username" value="admin" placeholder="管理员账号" /><input
            id="password"
            type="password"
            placeholder="管理员密码"
          /><button id="loginBtn">登录</button>
        </div>
        <p id="msg" class="muted"></p>
      </section>
      <section id="app" class="panel" hidden>
        <h2 id="welcome">欢迎回来</h2>
        <p class="muted">请选择上方的管理模块。</p>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      async function api(url, opt = {}) {
        const r = await fetch(url, {
          credentials: "include",
          headers: { "Content-Type": "application/json", ...(localStorage.getItem("arcadia_admin_token") ? { Authorization: "Bearer " + localStorage.getItem("arcadia_admin_token") } : {}) },
          ...opt,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw Error(d.error || "请求失败");
        return d;
      }
      function openApp(u) {
        $("login").hidden = true;
        $("app").hidden = false;
        $("nav").classList.add("visible");
        $("logout").hidden = false;
        $("welcome").textContent = "欢迎回来，" + u.username;
      }
      async function check() {
        try {
          const d = await api("/api/auth/me");
          if (d.user?.role === "admin") openApp(d.user);
        } catch (_) {}
      }
      $("loginBtn").onclick = async () => {
        try {
          const d = await api("/api/admin/login", {
            method: "POST",
            body: JSON.stringify({
              username: $("username").value.trim(),
              password: $("password").value,
            }),
          });
          localStorage.setItem("arcadia_admin_token", d.token || "");
          openApp(d.user);
        } catch (e) {
          $("msg").textContent = e.message;
        }
      };
      $("logout").onclick = async () => {
        await api("/api/auth/logout", { method: "POST" });
        location.reload();
      };
      check();
    </script>
  </body>
</html>
