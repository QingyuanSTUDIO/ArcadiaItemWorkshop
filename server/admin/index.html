<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿卡狄亚工坊管理</title>
<style>:root{font-family:system-ui;color:#eee;background:#171717}*{box-sizing:border-box}body{margin:0}.bar{background:#d9a441;color:#171717;padding:15px 20px;display:flex;justify-content:space-between}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.panel{background:#242424;border:1px solid #444;border-radius:7px;padding:15px;margin-bottom:14px}.login{max-width:380px;margin:15vh auto}input,select,button{padding:9px 11px;border-radius:5px;border:1px solid #555;font:inherit}input,select{background:#111;color:#fff}button{background:#d9a441;border:0;cursor:pointer}.ghost{background:#444;color:#fff}.danger{background:#c85555;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.muted{color:#aaa}.item{border-top:1px solid #444;padding:13px 0}.item:first-child{border-top:0}.item h3{margin:0 0 5px}.meta{color:#aaa;font-size:13px;margin-bottom:8px}.entry{white-space:pre-wrap;background:#111;padding:10px;max-height:280px;overflow:auto;font-size:13px;margin-top:8px}</style>
<body><header class="bar"><b>阿卡狄亚物品工坊 · 管理</b><button id="logout" class="ghost hidden">退出</button></header><main class="wrap"><section id="login" class="panel login"><h2>管理员登录</h2><input id="password" type="password" placeholder="管理员密码" style="width:100%;margin-bottom:9px"><button id="loginBtn">登录</button><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div class="panel row"><input id="query" placeholder="搜索名称、作者或标签"><select id="status"><option value="">全部状态</option><option value="published">已发布</option><option value="hidden">已隐藏</option><option value="deleted">已删除</option></select><button id="refresh">刷新</button><span id="count" class="muted"></span></div><div id="items" class="panel"></div></section></main>
<script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(o.headers||{})},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}function openApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');load()}async function load(){try{const d=await api('/api/admin/items?q='+encodeURIComponent($('query').value)+'&status='+encodeURIComponent($('status').value));$('count').textContent='共 '+d.total+' 条';$('items').innerHTML=d.items.length?d.items.map(i=>`<article class="item"><h3>${esc(i.name)} <small>${esc(i.status)}</small></h3><div class="meta">${esc(i.category)}　作者：${esc(i.author||'未填写')}　举报：${i.reportCount}</div><div class="row"><button onclick="detail('${i.id}')">查看内容</button>${i.status==='hidden'?`<button onclick="statusSet('${i.id}','published')">恢复发布</button>`:i.status==='published'?`<button class="ghost" onclick="statusSet('${i.id}','hidden')">隐藏</button>`:''}<button class="danger" onclick="removeItem('${i.id}')">删除</button></div><pre id="d-${i.id}" class="entry hidden"></pre></article>`).join(''):'<p class="muted">没有匹配条目</p>'}catch(e){if(e.message==='需要管理员登录')location.reload();else $('items').textContent=e.message}}async function detail(id){const b=$('d-'+id);if(!b.classList.contains('hidden'))return b.classList.add('hidden');const d=await api('/api/admin/items/'+id);b.textContent=JSON.stringify({entry:d.item.entry,reports:d.item.reports||[]},null,2);b.classList.remove('hidden')}async function statusSet(id,status){await api('/api/admin/items/'+id+'/status',{method:'POST',body:JSON.stringify({status})});load()}async function removeItem(id){if(confirm('确定软删除这个条目？')){await api('/api/admin/items/'+id+'/delete',{method:'POST'});load()}}$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});openApp()}catch(e){$('msg').textContent=e.message}};$('refresh').onclick=load;$('status').onchange=load;$('query').onkeydown=e=>e.key==='Enter'&&load();$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};(async()=>{try{await api('/api/admin/items?limit=1');openApp()}catch(_){}})();</script></body></html>
