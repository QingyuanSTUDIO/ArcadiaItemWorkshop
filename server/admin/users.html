<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理</title><style>body{font-family:system-ui;background:#171717;color:#eee;margin:0}.bar{background:#d9a441;color:#171717;padding:15px 20px}.wrap{max-width:900px;margin:24px auto;padding:0 14px}.panel{background:#242424;border:1px solid #444;border-radius:7px;padding:16px}.user{border-top:1px solid #444;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}button{background:#d9a441;border:0;border-radius:5px;padding:8px 11px;cursor:pointer}.muted{color:#aaa}</style><header class="bar"><b>阿卡狄亚工坊 · 用户管理</b></header><main class="wrap"><div class="panel"><p id="msg" class="muted">加载中…</p><div id="list"></div></div></main><script>async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}async function load(){try{const d=await api('/api/admin/users');document.getElementById('msg').textContent='共 '+d.users.length+' 个用户';document.getElementById('list').innerHTML=d.users.map(u=>`<div class="user"><span>${u.username}　<small>${u.role}</small></span><button onclick="role('${u.id}','${u.role==='admin'?'user':'admin'}')">设为${u.role==='admin'?'普通用户':'管理员'}</button></div>`).join('')}catch(e){document.getElementById('msg').textContent=e.message}}async function role(id,r){await api('/api/admin/users/'+id+'/role',{method:'POST',body:JSON.stringify({role:r})});load()}load()</script>
