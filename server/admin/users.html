<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿卡狄亚工坊账号</title><style>body{font-family:system-ui;background:#171717;color:#eee;margin:0}.bar{background:#d9a441;color:#171717;padding:15px 20px}.wrap{max-width:900px;margin:24px auto;padding:0 14px}.panel{background:#242424;border:1px solid #444;border-radius:7px;padding:16px;margin-bottom:14px}.auth{max-width:400px;margin:12vh auto}input,button{font:inherit;padding:9px;border-radius:5px;border:1px solid #555;margin:4px 0}input{width:100%;background:#111;color:#fff}button{background:#d9a441;border:0;cursor:pointer}.muted{color:#aaa}.user{border-top:1px solid #444;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.danger{background:#c85555;color:#fff}</style><header class="bar"><b>阿卡狄亚工坊 · 用户面板</b></header><main class="wrap"><section id="auth" class="panel auth"><h2 id="title">登录</h2><input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码（至少 8 位）"><button id="submit">登录</button> <button id="toggle">注册账号</button><p id="msg" class="muted"></p></section><section id="panel" class="panel" hidden><div><b id="who"></b><button id="logout" class="danger" style="float:right">退出</button></div><p id="state" class="muted"></p><div id="list"></div></section></main><script>const $=id=>document.getElementById(id);let register=false,user=null;async function api(u,o={}){const r=await fetch(u,{credentials:'include',headers:{'Content-Type':'application/json'},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}function setMode(){register=!register;$('title').textContent=register?'注册':'登录';$('submit').textContent=register?'注册并登录':'登录';$('toggle').textContent=register?'返回登录':'注册账号'}async function enter(){try{if(register){await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})})}const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});user=d.user;sessionStorage.setItem('arcadia_token',d.token||'');if(user.role!=='admin')throw Error('已登录，但此页面仅管理员可访问');$('auth').hidden=true;$('panel').hidden=false;$('who').textContent=user.username+'（管理员）';load()}catch(e){$('msg').textContent=e.message}}async function load(){try{const d=await api('/api/admin/users');$('state').textContent='共 '+d.users.length+' 个账号';$('list').innerHTML=d.users.map(u=>`<div class="user"><span>${u.username}　<small>${u.role}</small></span><button onclick="role('${u.id}','${u.role==='admin'?'user':'admin'}')">设为${u.role==='admin'?'普通用户':'管理员'}</button></div>`).join('')}catch(e){$('state').textContent=e.message}}async function role(id,r){try{await api('/api/admin/users/'+id+'/role',{method:'POST',body:JSON.stringify({role:r})});load()}catch(e){$('state').textContent=e.message}}$('toggle').onclick=setMode;$('submit').onclick=enter;$('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};</script>
