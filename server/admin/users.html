<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>阿卡狄亚工坊账号</title
  ><style>
    body {
      font-family: system-ui;
      background: #171717;
      color: #eee;
      margin: 0;
    }
    .bar {
      background: #d9a441;
      color: #171717;
      padding: 15px 20px;
    }
    .wrap {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 14px;
    }
    .panel {
      background: #242424;
      border: 1px solid #444;
      border-radius: 7px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .auth {
      max-width: 400px;
      margin: 12vh auto;
    }
    input,
    button {
      font: inherit;
      padding: 9px;
      border-radius: 5px;
      border: 1px solid #555;
      margin: 4px 0;
    }
    input {
      width: 100%;
      background: #111;
      color: #fff;
    }
    button {
      background: #d9a441;
      border: 0;
      cursor: pointer;
    }
    .muted {
      color: #aaa;
    }
    .user {
      border-top: 1px solid #444;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .danger {
      background: #c85555;
      color: #fff;
    }
  </style>
  <header class="bar"><b>阿卡狄亚工坊 · 用户管理</b></header>
  <main class="wrap">
    <section id="auth" class="panel auth">
      <h2>管理员登录</h2>
      <input id="username" value="admin" placeholder="管理员账号" /><input
        id="password"
        type="password"
        placeholder="管理员密码"
      /><button id="submit">登录</button>
      <p id="msg" class="muted"></p>
    </section>
    <section id="panel" class="panel" hidden>
      <div>
        <b id="who"></b
        ><button id="logout" class="danger" style="float: right">退出</button>
      </div>
      <p id="state" class="muted"></p>
      <div id="list"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    async function api(u, o = {}) {
      const r = await fetch(u, {
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          ...o,
        }),
        d = await r.json().catch(() => ({}));
      if (!r.ok) throw Error(d.error || "请求失败");
      return d;
    }
    function openApp(user) {
      $("auth").hidden = true;
      $("panel").hidden = false;
      $("who").textContent = user.username + "（管理员）";
      load();
    }
    async function load() {
      try {
        const d = await api("/api/admin/users");
        $("state").textContent = "共 " + d.users.length + " 个账号";
        $("list").innerHTML = d.users
          .map(
            (u) =>
              `<div class="user"><span>${u.username}　<small>${u.role}</small></span><button onclick="role('${u.id}','${u.role === "admin" ? "user" : "admin"}', this)">设为${u.role === "admin" ? "普通用户" : "管理员"}</button></div>`,
          )
          .join("");
      } catch (e) {
        $("state").textContent = e.message;
      }
    }
    async function role(id, r, button) {
      const button = event?.currentTarget;
      if (button) {
        button.disabled = true;
        button.textContent = "处理中…";
      }
      try {
        await api("/api/admin/users/" + id + "/role", {
          method: "POST",
          body: JSON.stringify({ role: r }),
        });
        $("state").textContent = "角色更新成功";
        await load();
      } catch (e) {
        $("state").textContent = e.message;
        alert("角色更新失败：" + e.message);
        if (button) button.disabled = false;
      }
    }
    $("submit").onclick = async () => {
      try {
        const d = await api("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({
            username: $("username").value.trim(),
            password: $("password").value,
          }),
        });
        if (d.user?.role !== "admin") throw Error("该账号不是管理员");
        openApp(d.user);
      } catch (e) {
        $("msg").textContent = e.message;
      }
    };
    $("logout").onclick = async () => {
      await api("/api/auth/logout", { method: "POST" });
      location.reload();
    };
    (async () => {
      try {
        const d = await api("/api/auth/me");
        if (d.user?.role === "admin") openApp(d.user);
      } catch (_) {}
    })();
  </script>
</html>
